<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeroHUD — RAYO</title>
<style>
/* ============================================================
   HeroHUD · theme: RAYO (Iron Man)
   Fluid animated desktop HUD. Techniques studied from
   JashanMaan28/Zorin (3-layer breathing orb, non-syncing
   timings, glassmorphism) fused with the RAYO arc-reactor.
   ============================================================ */

:root{
  /* ---- theme tokens (a theme = just this block + assets) ---- */
  --ink:        #06080b;
  --ink-2:      #0a0e13;
  --ice:        #78d2ee;
  --ice-bright: #a6ecff;
  --ice-deep:   #1f6f86;
  --ice-faint:  #2a4a58;
  --gold:       #c9a24b;
  --red:        #e5484d;
  --paper:      #d0e0e8;
  --muted:      #60717f;

  --glass:      rgba(10,16,22,0.42);
  --glass-brd:  rgba(120,210,238,0.22);
  --glass-hi:   rgba(255,255,255,0.06);

  --font-ui:    'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:  'JetBrains Mono','SF Mono',ui-monospace,monospace;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:var(--font-ui);
  color:var(--paper);
  /* preview backdrop — the real overlay is transparent over your desktop */
  background:
    radial-gradient(120% 90% at 50% 46%, #0d141b 0%, var(--ink) 62%, #04060a 100%);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* faint blueprint grid + drifting scanline for atmosphere */
.atmos{position:fixed;inset:0;pointer-events:none;z-index:0}
.atmos::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(42,74,88,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(42,74,88,.05) 1px,transparent 1px);
  background-size:46px 46px;
  mask:radial-gradient(120% 90% at 50% 46%,#000 40%,transparent 92%);
}
.atmos::after{
  content:"";position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(120,210,238,.14),transparent);
  animation:scan 7s linear infinite;
}
@keyframes scan{0%{top:-2%}100%{top:102%}}

/* fixed 1920x1200 design, scaled to fit any screen (letterbox) */
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1200px;
  transform-origin:center center;z-index:1}

/* ============================================================
   CENTER — the breathing arc reactor
   ============================================================ */
.reactor{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:560px;height:560px;
  display:grid;place-items:center;
}
.reactor .ring{position:absolute;border-radius:50%;inset:0;margin:auto}

/* outer thin ring + rotating conic sweep */
.ring-outer{width:560px;height:560px;border:1px solid rgba(120,210,238,.18)}
.ring-sweep{
  width:560px;height:560px;
  background:conic-gradient(from 0deg,
     transparent 0deg, transparent 300deg,
     rgba(120,210,238,.0) 300deg, rgba(120,210,238,.55) 355deg, transparent 360deg);
  mask:radial-gradient(circle, transparent 276px, #000 277px, #000 280px, transparent 281px);
  -webkit-mask:radial-gradient(circle, transparent 276px, #000 277px, #000 280px, transparent 281px);
  animation:spin 9s linear infinite;
}
/* dashed ring, counter-rotating */
.ring-dash{
  width:492px;height:492px;
  border:1px dashed rgba(120,210,238,.30);
  animation:spin 60s linear infinite reverse;
}
/* tick belt (rendered with repeating-conic) */
.ring-ticks{
  width:452px;height:452px;
  background:repeating-conic-gradient(rgba(120,210,238,.35) 0deg 0.5deg, transparent 0.5deg 5deg);
  mask:radial-gradient(circle, transparent 214px, #000 215px, #000 226px, transparent 227px);
  -webkit-mask:radial-gradient(circle, transparent 214px, #000 215px, #000 226px, transparent 227px);
  animation:spin 120s linear infinite;
}
/* primary confident ring */
.ring-main{width:420px;height:420px;border:2px solid rgba(120,210,238,.75);
  box-shadow:0 0 24px rgba(120,210,238,.25),inset 0 0 24px rgba(120,210,238,.12)}
.ring-inner{width:344px;height:344px;border:1px solid rgba(120,210,238,.28);
  animation:spin 40s linear infinite}
.ring-fine{width:250px;height:250px;border:1px solid rgba(208,224,232,.35)}

@keyframes spin{to{transform:rotate(360deg)}}

/* cardinal labels */
.cardinal{position:absolute;font-family:var(--font-mono);font-size:11px;color:rgba(120,210,238,.6);letter-spacing:1px}
.cardinal.n{top:26px;left:50%;transform:translateX(-50%)}
.cardinal.s{bottom:26px;left:50%;transform:translateX(-50%)}
.cardinal.e{right:22px;top:50%;transform:translateY(-50%)}
.cardinal.w{left:22px;top:50%;transform:translateY(-50%)}

/* --- the orb: 3 non-syncing layers (Zorin technique) --- */
.orb{position:relative;width:150px;height:150px}
.orb span{position:absolute;border-radius:50%}
.orb .core{
  inset:0;
  background:radial-gradient(circle at 32% 30%,
    var(--ice-bright) 0%, var(--ice) 26%, var(--ice-deep) 62%, #0a2e39 100%);
  box-shadow:
    0 0 70px rgba(120,210,238,.55),
    inset 0 0 40px rgba(10,40,50,.55),
    0 0 120px rgba(166,236,255,.30);
  animation:orbPulse 3s ease-in-out infinite;
}
.orb .glow{
  inset:8%;
  background:radial-gradient(circle at 42% 40%,
    rgba(166,236,255,.45) 0%, rgba(120,210,238,.28) 50%, transparent 100%);
  box-shadow:0 0 60px rgba(166,236,255,.4),inset 0 0 26px rgba(166,236,255,.18);
  animation:orbGlow 4s ease-in-out infinite reverse;
}
.orb .hi{
  inset:20%;
  background:radial-gradient(circle at 60% 30%,
    rgba(255,255,255,.55) 0%, rgba(120,210,238,.2) 42%, transparent 72%);
  animation:orbShimmer 5s ease-in-out infinite;
}
/* segmented reactor blades ring around the orb */
.blades{position:absolute;width:210px;height:210px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,
     var(--ice) 0deg 3deg, transparent 3deg 30deg);
  mask:radial-gradient(circle, transparent 78px, #000 80px, #000 98px, transparent 100px);
  -webkit-mask:radial-gradient(circle, transparent 78px, #000 80px, #000 98px, transparent 100px);
  opacity:.85;
  animation:spin 24s linear infinite, bladePulse 3s ease-in-out infinite;
}

@keyframes orbPulse{
  0%,100%{transform:scale(1);opacity:.92;
    box-shadow:0 0 70px rgba(120,210,238,.55),inset 0 0 40px rgba(10,40,50,.55),0 0 120px rgba(166,236,255,.30)}
  50%{transform:scale(1.025);opacity:1;
    box-shadow:0 0 92px rgba(120,210,238,.78),inset 0 0 50px rgba(10,40,50,.5),0 0 150px rgba(166,236,255,.5)}
}
@keyframes orbGlow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes orbShimmer{0%,100%{opacity:.55;transform:rotate(0) scale(1)}50%{opacity:.9;transform:rotate(180deg) scale(1.12)}}
@keyframes bladePulse{0%,100%{opacity:.7}50%{opacity:.95}}

/* crosshair ticks */
.tick{position:absolute;background:rgba(120,210,238,.5)}
.tick.t{width:2px;height:22px;top:-46px;left:50%;transform:translateX(-50%)}
.tick.l{height:2px;width:22px;left:-46px;top:50%;transform:translateY(-50%)}
.tick.r{height:2px;width:22px;right:-46px;top:50%;transform:translateY(-50%)}

/* ============================================================
   GLASS PANELS
   ============================================================ */
.panel{
  position:absolute;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:14px;
  backdrop-filter:blur(14px) saturate(1.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 1px 0 var(--glass-hi),
    0 0 0 1px rgba(120,210,238,.06);
  padding:16px 18px;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.panel .head{display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:600;letter-spacing:2px;color:var(--muted)}
.panel .head .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 8px var(--gold);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
.panel .rule{height:1px;background:linear-gradient(90deg,var(--glass-brd),transparent);margin:10px 0 12px}

/* stat row */
.stat{margin-bottom:14px}
.stat:last-child{margin-bottom:0}
.stat .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.stat .lbl{font-size:11px;letter-spacing:1px;color:var(--muted)}
.stat .val{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--paper)}
.stat .val .u{font-size:10px;color:var(--muted);margin-left:2px}
.stat .aux{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.bar{height:5px;border-radius:3px;background:rgba(120,210,238,.10);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--ice-deep),var(--ice));
  box-shadow:0 0 10px rgba(120,210,238,.5);
  transition:width 1.1s cubic-bezier(.2,.7,.2,1)}

/* left cluster position */
.left{left:52px;width:280px}
#pwr{top:150px}
#sys{top:322px}
#net{top:494px}

/* right telemetry */
.right{right:52px;top:150px;width:320px}
.tele-row{display:flex;align-items:baseline;justify-content:space-between;margin:9px 0;font-size:12px}
.tele-row .k{color:var(--muted);letter-spacing:.5px}
.tele-row .v{font-family:var(--font-mono);color:var(--paper)}
.tele-row .v.ice{color:var(--ice)}
.tele-sec{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);margin:16px 0 4px}
.tele-sec:first-child{margin-top:2px}
.mini-bar{height:4px;border-radius:2px;background:rgba(120,210,238,.10);overflow:hidden;margin-top:5px}
.mini-bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ice-deep),var(--ice));
  box-shadow:0 0 8px rgba(120,210,238,.5);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}

/* corner registration marks */
.reg{position:absolute;width:38px;height:38px;pointer-events:none;z-index:2}
.reg::before,.reg::after{content:"";position:absolute;background:rgba(120,210,238,.55)}
.reg::before{width:100%;height:1px}.reg::after{height:100%;width:1px}
.reg .p{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--ice);box-shadow:0 0 6px var(--ice)}
.reg.tl{top:40px;left:40px}.reg.tr{top:40px;right:40px}
.reg.bl{bottom:40px;left:40px}.reg.br{bottom:40px;right:40px}
.reg.tr::before,.reg.br::before{right:0}.reg.tr::after,.reg.br::after{right:0}
.reg.bl::before,.reg.br::before{bottom:0}.reg.bl::after,.reg.br::after{bottom:0}
.reg.tl .p{top:-2px;left:-2px}.reg.tr .p{top:-2px;right:-2px}
.reg.bl .p{bottom:-2px;left:-2px}.reg.br .p{bottom:-2px;right:-2px}

/* baseline wordmark */
.baseline{position:absolute;left:52px;bottom:64px;z-index:2}
.baseline .line{width:96px;height:2px;background:var(--gold);margin-bottom:14px;box-shadow:0 0 8px rgba(201,162,75,.6)}
.baseline .brand{font-size:16px;font-weight:600;letter-spacing:6px;color:var(--paper)}
.baseline .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.status{position:absolute;right:52px;bottom:64px;z-index:2;text-align:right}
.status .r{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--ice-deep)}
.status .o{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--gold);margin-top:4px}
.status .o::before{content:"● ";color:var(--gold)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="atmos"></div>

<div class="stage">
  <!-- CENTER REACTOR -->
  <div class="reactor">
    <div class="ring ring-outer"></div>
    <div class="ring ring-sweep"></div>
    <div class="ring ring-dash"></div>
    <div class="ring ring-ticks"></div>
    <div class="ring ring-main"></div>
    <div class="ring ring-inner"></div>
    <div class="ring ring-fine"></div>
    <span class="cardinal n">000</span>
    <span class="cardinal e">090</span>
    <span class="cardinal s">180</span>
    <span class="cardinal w">270</span>
    <div class="blades"></div>
    <div class="orb">
      <span class="core"></span>
      <span class="glow"></span>
      <span class="hi"></span>
      <span class="tick t"></span><span class="tick l"></span><span class="tick r"></span>
    </div>
  </div>

  <!-- LEFT CLUSTER -->
  <div class="panel left" id="pwr">
    <div class="head"><span>PWR.GRID</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="pwr-v">—<span class="u">%</span></span><span class="aux" id="pwr-a">battery</span></div>
      <div class="bar"><i id="pwr-b"></i></div>
    </div>
  </div>
  <div class="panel left" id="sys">
    <div class="head"><span>SYS.CORE</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="sys-v">—<span class="u">%</span></span><span class="aux" id="sys-a">cpu</span></div>
      <div class="bar"><i id="sys-b"></i></div>
    </div>
  </div>
  <div class="panel left" id="net">
    <div class="head"><span>LINK.NET</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="net-v">—<span class="u">%</span></span><span class="aux" id="net-a">signal</span></div>
      <div class="bar"><i id="net-b"></i></div>
    </div>
  </div>

  <!-- RIGHT TELEMETRY -->
  <div class="panel right" id="tele">
    <div class="head"><span>LIVE&nbsp;&nbsp;TELEMETRY</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="tele-sec">SYSTEM</div>
    <div class="tele-row"><span class="k">TIME</span><span class="v ice" id="t-time">--:--:--</span></div>
    <div class="tele-row"><span class="k">CPU</span><span class="v"><span id="t-cpu">—</span>% &nbsp;<span class="k" id="t-freq"></span></span></div>
    <div class="mini-bar"><i id="t-cpu-b"></i></div>
    <div class="tele-row"><span class="k">MEM</span><span class="v"><span id="t-mem">—</span>% &nbsp;<span class="k" id="t-memx"></span></span></div>
    <div class="mini-bar"><i id="t-mem-b"></i></div>
    <div class="tele-row"><span class="k">DISK</span><span class="v"><span id="t-disk">—</span>% &nbsp;<span class="k" id="t-diskx"></span></span></div>
    <div class="mini-bar"><i id="t-disk-b"></i></div>
    <div class="tele-sec">NETWORK</div>
    <div class="tele-row"><span class="k">SSID</span><span class="v" id="t-ssid">—</span></div>
    <div class="tele-row"><span class="k">DOWN</span><span class="v ice" id="t-down">—</span></div>
    <div class="tele-row"><span class="k">UP</span><span class="v ice" id="t-up">—</span></div>
    <div class="tele-sec">UPTIME</div>
    <div class="tele-row"><span class="k">SINCE BOOT</span><span class="v" id="t-up2">—</span></div>
  </div>

  <!-- CHROME -->
  <div class="reg tl"><span class="p"></span></div>
  <div class="reg tr"><span class="p"></span></div>
  <div class="reg bl"><span class="p"></span></div>
  <div class="reg br"><span class="p"></span></div>
  <div class="baseline">
    <div class="line"></div>
    <div class="brand">MG&nbsp;HOLDINGS</div>
    <div class="sub">CLASS-R · SYSTEMS INTERFACE</div>
  </div>
  <div class="status">
    <div class="r">R.A.Y.O</div>
    <div class="o">ONLINE</div>
  </div>
</div>

<script src="core/hud.js"></script>
</body>
</html>
