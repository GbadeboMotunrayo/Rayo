<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayo · Live HUD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
/* ============================================================
   Rayo · theme: RAYO (Iron Man)
   Fluid animated desktop HUD. Techniques studied from
   JashanMaan28/Zorin (3-layer breathing orb, non-syncing
   timings, glassmorphism) fused with the RAYO arc-reactor.
   ============================================================ */

:root{
  /* ---- theme tokens (RAYO defaults; core/theme.js overrides these live) ----
     Every colour in the HUD resolves from these, so a theme = just this set of
     values (see hud/themes/<name>/theme.json). The *-rgb tokens are the same
     hero colours as bare "R G B" triples so we can build any translucency with
     rgb(var(--x-rgb) / <alpha>) instead of hard-coding rgba() literals. */
  --ink:        #06080b;   /* deepest backdrop            */
  --ink-2:      #0a0e13;   /* backdrop mid                */
  --ink-0:      #04060a;   /* backdrop edge (darkest)     */
  --ice:        #78d2ee;   /* HERO colour                 */
  --ice-bright: #a6ecff;   /* hero, brighter              */
  --ice-deep:   #1f6f86;   /* hero, deep (bar gradients)  */
  --ice-faint:  #2a4a58;   /* hero, desaturated           */
  --ice-hi:     #e9f9ff;   /* near-white core highlight   */
  --ice-abyss:  #0c3b49;   /* dark core base              */
  --ice-rgb:        120 210 238;   /* --ice as R G B      */
  --ice-bright-rgb: 166 236 255;   /* --ice-bright as RGB */
  --ice-hi-rgb:     233 249 255;   /* highlight as RGB    */
  --gold:       #c9a24b;   /* charging / accent           */
  --red:        #e5484d;   /* alerts / danger             */
  --paper:      #d0e0e8;   /* primary text                */
  --muted:      #60717f;   /* secondary text              */

  --glass:      rgba(10,16,22,0.80);        /* panel fill (solid — no blur) */
  --glass-brd:  rgb(var(--ice-rgb) / .24);  /* panel border                 */
  --glass-hi:   rgba(255,255,255,0.06);     /* top highlight (theme-neutral) */

  --font-ui:    'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:  'JetBrains Mono','SF Mono',ui-monospace,monospace;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:var(--font-ui);
  color:var(--paper);
  /* preview backdrop — the real overlay is transparent over your desktop */
  background:
    radial-gradient(120% 90% at 50% 46%, var(--ink-2) 0%, var(--ink) 62%, var(--ink-0) 100%);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* faint blueprint grid + drifting scanline for atmosphere */
.atmos{position:fixed;inset:0;pointer-events:none;z-index:0}
.atmos::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgb(var(--ice-rgb) / .05) 1px,transparent 1px),
    linear-gradient(90deg,rgb(var(--ice-rgb) / .05) 1px,transparent 1px);
  background-size:46px 46px;
  mask:radial-gradient(120% 90% at 50% 46%,#000 40%,transparent 92%);
}
/* (drifting scanline removed — was distracting) */

/* fixed 1920x1200 design, scaled to fit any screen (letterbox) */
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1200px;
  transform-origin:center center;z-index:1}

/* ============================================================
   CENTER — the breathing arc reactor
   ============================================================ */
.reactor{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.75); /* 25% smaller */
  width:560px;height:560px;
  display:grid;place-items:center;
}
.reactor .ring{position:absolute;border-radius:50%;inset:0;margin:auto}

/* --- FIVE concentric rings, all spinning, alternating direction:
       r1 CW · r2 CCW · r3 CW · r4 CCW · r5 CW.
       Each = a faint full ring + a bright glowing arc that travels around it.
       Different speeds so they never sync (organic motion). --- */
/* base: a faint full ring for structure; the bright arc lives on 2 adjacent
   sides (a clear ~half-ring glow) with the rest TRANSPARENT so the rotation
   is unmistakable. */
/* Rings built the SAME way as the ruler (conic-gradient + radial mask) — the
   border technique didn't render in the WebKitGTK overlay's software mode, but
   this does. Each ring is a ~12px band showing a bright arc that travels as it
   spins. No filter/border → also cheap. */
/* Directions (outer→inner): CW · CCW · CW(ruler) · CCW · CW · CCW.
   Each arc starts at a different clock position (from Xdeg: 0=12:00, 60=2:00,
   120=4:00, 180=6:00, 240=8:00, 300=10:00) so they're spread, not synced.
   Bands 4.5px (25% thinner). A dark drop-shadow gives a 3D raised feel. */
/* each ring's mask lives in --m so both the ring AND its shadow copy use it
   (no fragile mask:inherit). Directions outer→inner: CCW·CW·CCW·CW·CCW·CW. */
.reactor .ring{border:none;-webkit-mask:var(--m);mask:var(--m);
  /* cache each ring as its own layer so the spin just re-composites a cached
     bitmap instead of re-rasterising the conic-gradient every frame. This is
     the big CPU saver under software rendering. */
  will-change:transform;transform:translateZ(0);backface-visibility:hidden}
/* real 3D shadow: a dark, offset copy of the same ring behind it. (CSS filter
   drop-shadow does NOT render in the WebKitGTK overlay; a masked element does.) */
.reactor .ring::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);
  -webkit-mask:var(--m);mask:var(--m);transform:translate(2px,3px);z-index:-1}
.r1{--m:radial-gradient(circle,transparent 265px,#000 265.5px,#000 270px,transparent 271px);
  width:540px;height:540px;
  background:conic-gradient(from 0deg,var(--ice-bright),var(--ice) 55deg,rgb(var(--ice-rgb) / .12) 120deg,transparent 165deg);
  animation:spin 14s steps(280) infinite reverse}
.r2{--m:radial-gradient(circle,transparent 223px,#000 223.5px,#000 228px,transparent 229px);
  width:456px;height:456px;
  background:conic-gradient(from 180deg,var(--ice-bright),var(--ice) 55deg,rgb(var(--ice-rgb) / .12) 120deg,transparent 165deg);
  animation:spin 12s steps(240) infinite}
.r3{--m:radial-gradient(circle,transparent 185px,#000 185.5px,#000 190px,transparent 191px);
  width:380px;height:380px;
  background:conic-gradient(from 240deg,var(--ice-bright),var(--ice) 55deg,rgb(var(--ice-rgb) / .12) 120deg,transparent 165deg);
  animation:spin 10s steps(200) infinite}
.r4{--m:radial-gradient(circle,transparent 151px,#000 151.5px,#000 156px,transparent 157px);
  width:312px;height:312px;
  background:conic-gradient(from 120deg,var(--ice-bright),var(--ice) 55deg,rgb(var(--ice-rgb) / .12) 120deg,transparent 165deg);
  animation:spin 8s steps(180) infinite reverse}
.r5{--m:radial-gradient(circle,transparent 118px,#000 118.5px,#000 123px,transparent 124px);
  width:246px;height:246px;
  background:conic-gradient(from 300deg,var(--ice-bright),var(--ice) 55deg,rgb(var(--ice-rgb) / .12) 120deg,transparent 165deg);
  animation:spin 6s steps(160) infinite}

/* the "ruler" — tick-mark ring · spinning CCW */
.ruler{--m:radial-gradient(circle, transparent 197px, #000 198px, #000 207px, transparent 208px);
  width:414px;height:414px;border:none!important;
  background:repeating-conic-gradient(rgb(var(--ice-bright-rgb) / .6) 0deg 0.4deg, transparent 0.4deg 5deg);
  animation:spin 40s steps(360) infinite reverse}

@keyframes spin{to{transform:rotate(360deg)}}

/* cardinal labels */
.cardinal{position:absolute;font-family:var(--font-mono);font-size:11px;color:rgb(var(--ice-rgb) / .6);letter-spacing:1px}
.cardinal.n{top:26px;left:50%;transform:translateX(-50%)}
.cardinal.s{bottom:26px;left:50%;transform:translateX(-50%)}
.cardinal.e{right:22px;top:50%;transform:translateY(-50%)}
.cardinal.w{left:22px;top:50%;transform:translateY(-50%)}

/* --- the orb: 3 non-syncing layers (Zorin technique) --- */
.orb{position:relative;width:150px;height:150px}
.orb span{position:absolute;border-radius:50%;will-change:transform,opacity;backface-visibility:hidden}
.orb .core{
  inset:0;
  /* solid, opaque blue disc — the glow lives INSIDE the circle */
  background:radial-gradient(circle at 34% 30%,
    var(--ice-hi) 0%, var(--ice-bright) 22%, var(--ice) 52%, var(--ice-deep) 84%, var(--ice-abyss) 100%);
  box-shadow:
    inset 0 0 46px rgba(255,255,255,.28),   /* internal luminosity */
    inset 0 0 20px rgb(var(--ice-hi-rgb) / .35),
    0 0 14px rgb(var(--ice-rgb) / .4);          /* tight edge glow only — no far bloom */
  animation:orbPulse 3s ease-in-out infinite;
}
.orb .glow{
  inset:8%;
  background:radial-gradient(circle at 42% 40%,
    rgb(var(--ice-hi-rgb) / .55) 0%, rgb(var(--ice-rgb) / .32) 50%, transparent 100%);
  box-shadow:inset 0 0 26px rgb(var(--ice-hi-rgb) / .25);   /* contained — no outer bloom */
  animation:orbGlow 4s ease-in-out infinite reverse;
}
.orb .hi{
  inset:20%;
  background:radial-gradient(circle at 60% 30%,
    rgba(255,255,255,.55) 0%, rgb(var(--ice-rgb) / .2) 42%, transparent 72%);
  animation:orbShimmer 5s ease-in-out infinite;   /* glow only, no rotation */
}
/* segmented reactor blades ring around the orb — STATIC, only glows */
.blades{position:absolute;width:210px;height:210px;border-radius:50%;will-change:opacity;
  background:repeating-conic-gradient(from 0deg,
     var(--ice) 0deg 3deg, transparent 3deg 30deg);
  mask:radial-gradient(circle, transparent 78px, #000 80px, #000 98px, transparent 100px);
  -webkit-mask:radial-gradient(circle, transparent 78px, #000 80px, #000 98px, transparent 100px);
  opacity:.85;
  animation:bladePulse 3s ease-in-out infinite;   /* glow bright↔dim, no spin */
}

@keyframes orbPulse{
  /* cheap pulse: only transform+opacity animate (compositor-friendly).
     The box-shadow stays static (set on .core) — animating it repainted the
     orb every frame. The .glow/.hi layers give the bright↔dim feel. */
  0%,100%{transform:scale(1);opacity:.94}
  50%{transform:scale(1.02);opacity:1}
}
@keyframes orbGlow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes orbShimmer{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.9;transform:scale(1.1)}}
@keyframes bladePulse{0%,100%{opacity:.55}50%{opacity:1}}

/* crosshair ticks */
.tick{position:absolute;background:rgb(var(--ice-rgb) / .5)}
.tick.t{width:2px;height:22px;top:-46px;left:50%;transform:translateX(-50%)}
.tick.l{height:2px;width:22px;left:-46px;top:50%;transform:translateY(-50%)}
.tick.r{height:2px;width:22px;right:-46px;top:50%;transform:translateY(-50%)}

/* ============================================================
   GLASS PANELS
   ============================================================ */
.panel{
  position:absolute;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  border-radius:14px;
  /* backdrop-filter blur removed — it re-blurs every frame under software
     rendering and was a top CPU cost. Solid translucent fill reads the same. */
  box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 1px 0 var(--glass-hi);
  padding:16px 18px;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.panel .head{display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-weight:600;letter-spacing:2px;color:var(--muted)}
.panel .head .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 8px var(--gold);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
.panel .rule{height:1px;background:linear-gradient(90deg,var(--glass-brd),transparent);margin:10px 0 12px}

/* stat row */
.stat{margin-bottom:14px}
.stat:last-child{margin-bottom:0}
.stat .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.stat .lbl{font-size:11px;letter-spacing:1px;color:var(--muted)}
.stat .val{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--paper)}
.stat .val .u{font-size:10px;color:var(--muted);margin-left:2px}
.stat .aux{font-size:10px;color:var(--muted);font-family:var(--font-mono)}
.bar{height:5px;border-radius:3px;background:rgb(var(--ice-rgb) / .10);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--ice-deep),var(--ice));
  box-shadow:0 0 10px rgb(var(--ice-rgb) / .5);
  transition:width 1.1s cubic-bezier(.2,.7,.2,1)}

/* charging state — power card warms to gold */
#pwr.charging{border-color:rgba(201,162,75,.4);
  box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 var(--glass-hi),0 0 24px rgba(201,162,75,.14)}
#pwr.charging .bar>i{background:linear-gradient(90deg,#8a6f2e,var(--gold));
  box-shadow:0 0 10px rgba(201,162,75,.55)}
#pwr.charging .head .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
#pwr.charging .aux{color:var(--gold)}

/* left cluster position */
.left{left:52px;width:280px}
#pwr{top:120px}
#sys{top:238px}
#net{top:356px}
#weather{top:474px}

/* right telemetry */
.right{right:52px;top:150px;width:320px}
.tele-row{display:flex;align-items:baseline;justify-content:space-between;margin:9px 0;font-size:12px}
.tele-row .k{color:var(--muted);letter-spacing:.5px}
.tele-row .v{font-family:var(--font-mono);color:var(--paper)}
.tele-row .v.ice{color:var(--ice)}
.tele-sec{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);margin:16px 0 4px}
.tele-sec:first-child{margin-top:2px}
.mini-bar{height:4px;border-radius:2px;background:rgb(var(--ice-rgb) / .10);overflow:hidden;margin-top:5px}
.mini-bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--ice-deep),var(--ice));
  box-shadow:0 0 8px rgb(var(--ice-rgb) / .5);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}

/* fan speedometer */
.gauge-wrap{display:flex;justify-content:center;margin-top:8px}
#fan-gauge{width:184px;height:184px;overflow:visible}
#fan-gauge .g-track{fill:none;stroke:rgb(var(--ice-rgb) / .13);stroke-linecap:round}
#fan-gauge .g-fill{fill:none;stroke-linecap:round;
  transition:stroke .5s linear}
#fan-gauge .g-tick{stroke:rgb(var(--ice-bright-rgb) / .35)}
#fan-gauge .g-tick.maj{stroke:rgb(var(--ice-bright-rgb) / .7)}
#fan-gauge .g-needle{stroke:var(--ice-bright);stroke-linecap:round;
  transition:stroke .5s linear}
#fan-gauge .g-hub{fill:var(--ice-bright)}
#fan-gauge .g-hub-in{fill:#06080b}
#fan-gauge .g-val{fill:var(--paper);font-family:var(--font-mono);font-weight:700;
  font-size:34px;text-anchor:middle}
#fan-gauge .g-unit{fill:var(--muted);font-family:var(--font-mono);font-weight:600;
  font-size:12px;letter-spacing:2px;text-anchor:middle}
#fan-gauge .g-lbl{fill:var(--muted);font-family:var(--font-mono);font-weight:600;
  font-size:10px;letter-spacing:2px;text-anchor:middle}

/* corner registration marks */
.reg{position:absolute;width:38px;height:38px;pointer-events:none;z-index:2}
.reg::before,.reg::after{content:"";position:absolute;background:rgb(var(--ice-rgb) / .55)}
.reg::before{width:100%;height:1px}.reg::after{height:100%;width:1px}
.reg .p{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--ice);box-shadow:0 0 6px var(--ice)}
.reg.tl{top:40px;left:40px}.reg.tr{top:40px;right:40px}
.reg.bl{bottom:40px;left:40px}.reg.br{bottom:40px;right:40px}
.reg.tr::before,.reg.br::before{right:0}.reg.tr::after,.reg.br::after{right:0}
.reg.bl::before,.reg.br::before{bottom:0}.reg.bl::after,.reg.br::after{bottom:0}
.reg.tl .p{top:-2px;left:-2px}.reg.tr .p{top:-2px;right:-2px}
.reg.bl .p{bottom:-2px;left:-2px}.reg.br .p{bottom:-2px;right:-2px}

/* baseline wordmark */
.baseline{position:absolute;left:52px;bottom:64px;z-index:2}
.baseline .line{width:96px;height:2px;background:var(--gold);margin-bottom:14px;box-shadow:0 0 8px rgba(201,162,75,.6)}
.baseline .brand{font-size:16px;font-weight:600;letter-spacing:6px;color:var(--paper)}
.baseline .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.status{position:absolute;right:52px;bottom:64px;z-index:2;text-align:right}
.status .r{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--ice-deep)}
.status .o{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--ice);margin-top:4px}
.status .o::before{content:"● ";color:var(--ice)}
.status .o.sim{color:var(--muted)}
.status .o.sim::before{color:var(--red)}

/* ============================================================
   INTERACTIVE HUB CONTROL (control.js)
   ============================================================ */
/* let clicks reach the hub, not the decorative rings/orb behind it */
.reactor .ring,.ruler,.blades,.orb,.orb *{pointer-events:none}
.hub-hit{position:absolute;left:50%;top:50%;width:150px;height:150px;
  transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:6;
  pointer-events:auto}
.hub-hit:hover{box-shadow:0 0 0 2px rgb(var(--ice-bright-rgb) / .25) inset}

/* radial menu — items bloom out from the centre to 12 points */
.hubmenu{position:absolute;left:50%;top:50%;width:0;height:0;z-index:20;
  pointer-events:none}
.hubmenu.open{pointer-events:auto}
.hm-item{position:absolute;left:0;top:0;
  min-width:78px;padding:9px 12px;border:1px solid var(--glass-brd);
  background:rgba(10,16,22,.92);color:var(--paper);border-radius:11px;
  font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1px;
  white-space:nowrap;cursor:pointer;text-align:center;
  box-shadow:0 8px 26px rgba(0,0,0,.55),inset 0 1px 0 var(--glass-hi);
  transform:translate(-50%,-50%) scale(.2);opacity:0;
  transition:transform .34s cubic-bezier(.2,.8,.2,1.2),opacity .28s ease,
             border-color .2s,color .2s,background .2s}
.hubmenu.open .hm-item{opacity:1;
  transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1)}
/* dock-style magnify on hover */
.hubmenu.open .hm-item:hover{
  transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.28);
  border-color:var(--ice);color:var(--ice-bright);
  background:rgba(18,30,40,.96);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 18px rgb(var(--ice-rgb) / .35)}
.hm-item.danger:hover{border-color:var(--red);color:#ff9a9d;
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 18px rgba(229,72,77,.4)}

/* quick power bar (double-click) */
.powerbar{position:absolute;left:50%;top:calc(50% - 250px);
  transform:translate(-50%,-50%) scale(.9);z-index:21;display:flex;gap:10px;
  padding:12px;border:1px solid var(--glass-brd);border-radius:16px;
  background:rgba(10,16,22,.94);box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 var(--glass-hi);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .28s cubic-bezier(.2,.8,.2,1.1)}
.powerbar.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.powerbar button{display:flex;flex-direction:column;align-items:center;gap:5px;
  min-width:84px;padding:12px 10px;border:1px solid transparent;border-radius:12px;
  background:rgb(var(--ice-rgb) / .06);color:var(--paper);cursor:pointer;
  font-family:var(--font-mono);font-size:20px;line-height:1;transition:all .18s}
.powerbar button span{font-size:9px;letter-spacing:1.5px;color:var(--muted)}
.powerbar button:hover{background:rgb(var(--ice-rgb) / .14);border-color:var(--ice);
  box-shadow:0 0 16px rgb(var(--ice-rgb) / .3)}
.powerbar button:hover span{color:var(--ice)}
.powerbar button.danger:hover{background:rgba(229,72,77,.14);border-color:var(--red);
  box-shadow:0 0 16px rgba(229,72,77,.35)}
.powerbar button.danger:hover span{color:#ff9a9d}

/* shutdown countdown */
.countdown{position:absolute;inset:0;z-index:40;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 45%,rgba(6,8,11,.86),rgba(6,8,11,.97));
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.countdown.open{opacity:1;pointer-events:auto}
.cd-num{font-family:var(--font-mono);font-size:120px;font-weight:800;color:#ff9a9d;
  text-shadow:0 0 40px rgba(229,72,77,.5);line-height:1}
.cd-msg{font-family:var(--font-mono);font-size:16px;letter-spacing:6px;color:var(--paper)}
.cd-cancel{margin-top:10px;padding:12px 28px;border:1px solid var(--ice);
  background:rgb(var(--ice-rgb) / .1);color:var(--ice-bright);border-radius:12px;
  font-family:var(--font-mono);font-size:13px;letter-spacing:2px;cursor:pointer;
  transition:all .18s}
.cd-cancel:hover{background:rgb(var(--ice-rgb) / .22);box-shadow:0 0 20px rgb(var(--ice-rgb) / .4)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}

/* IDLE / OCCLUDED: when the overlay is fully covered by a window (i.e. you're
   actually working and can't see the HUD anyway), the overlay process adds
   .rayo-idle and every animation freezes. WebKit stops re-compositing, so the
   overlay drops to ~0% CPU and the fan stays quiet. Removed the instant the
   desktop is shown again. This is the single biggest thermal win. */
html.rayo-idle *,
html.rayo-idle *::before,
html.rayo-idle *::after{animation-play-state:paused!important}
</style>
<script>
// OBS Studio's Linux Browser Source (CEF) has a known bug where it flattens
// premultiplied alpha instead of compositing it — semi-transparent colors
// render as if scaled toward black. The desktop overlay (start.sh) doesn't
// go through this path and is unaffected, so this only activates when OBS
// explicitly asks for it via ?obsSafe=1, making glass panels fully opaque
// (immune to the bug) instead of translucent. The page's own background
// stays genuinely transparent — chroma-key that out in OBS instead.
if (new URLSearchParams(location.search).get('obsSafe') === '1') {
  document.documentElement.style.setProperty('--glass', 'rgb(10,16,22)');
}
</script>
</head>
<body>
<div class="atmos"></div>

<div class="stage">
  <!-- CENTER REACTOR -->
  <div class="reactor">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring ruler"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <span class="cardinal n">000</span>
    <span class="cardinal e">090</span>
    <span class="cardinal s">180</span>
    <span class="cardinal w">270</span>
    <div class="blades"></div>
    <div class="orb">
      <span class="core"></span>
      <span class="glow"></span>
      <span class="hi"></span>
      <span class="tick t"></span><span class="tick l"></span><span class="tick r"></span>
    </div>
    <!-- interactive hub: 1 click = radial menu · 2 = power bar · 3 = shutdown -->
    <div class="hub-hit" id="hub-hit" title="click: menu  ·  double-click: power  ·  triple-click: shut down"></div>
  </div>

  <!-- RADIAL CONTROL MENU (blooms from the hub; items built by control.js) -->
  <div class="hubmenu" id="hubmenu" aria-hidden="true"></div>

  <!-- QUICK POWER BAR (double-click the hub) -->
  <div class="powerbar" id="powerbar" aria-hidden="true">
    <button data-act="poweroff" class="danger">⏻<span>SHUTDOWN</span></button>
    <button data-act="reboot">⟳<span>RESTART</span></button>
    <button data-act="suspend">☾<span>SLEEP</span></button>
    <button data-act="lock">⚿<span>LOCK</span></button>
    <button data-act="dnd">◐<span>FOCUS</span></button>
  </div>

  <!-- SHUTDOWN COUNTDOWN (triple-click, cancellable) -->
  <div class="countdown" id="countdown" aria-hidden="true">
    <div class="cd-num" id="cd-num">4</div>
    <div class="cd-msg">POWERING DOWN</div>
    <button class="cd-cancel" id="cd-cancel">CANCEL</button>
  </div>

  <!-- LEFT CLUSTER -->
  <div class="panel left" id="pwr">
    <div class="head"><span>PWR.GRID</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="pwr-v">—<span class="u">%</span></span><span class="aux" id="pwr-a">battery</span></div>
      <div class="bar"><i id="pwr-b"></i></div>
    </div>
  </div>
  <div class="panel left" id="sys">
    <div class="head"><span>SYS.CORE</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="sys-v">—<span class="u">%</span></span><span class="aux" id="sys-a">cpu</span></div>
      <div class="bar"><i id="sys-b"></i></div>
    </div>
  </div>
  <div class="panel left" id="net">
    <div class="head"><span>LINK.NET</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="net-v">—<span class="u">%</span></span><span class="aux" id="net-a">signal</span></div>
      <div class="bar"><i id="net-b"></i></div>
    </div>
  </div>
  <div class="panel left" id="weather">
    <div class="head"><span>WEATHER</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="stat">
      <div class="top"><span class="val" id="wx-t">—</span><span class="aux" id="wx-c">—</span></div>
      <div class="top" style="margin-top:8px"><span class="aux" id="wx-loc">—</span><span class="aux" id="wx-fl"></span></div>
    </div>
  </div>

  <!-- RIGHT TELEMETRY -->
  <div class="panel right" id="tele">
    <div class="head"><span>LIVE&nbsp;&nbsp;TELEMETRY</span><span class="dot"></span></div>
    <div class="rule"></div>
    <div class="tele-sec">SYSTEM</div>
    <div class="tele-row"><span class="k">TIME</span><span class="v ice" id="t-time">--:--:--</span></div>
    <div class="tele-row"><span class="k">CPU</span><span class="v"><span id="t-cpu">—</span>% &nbsp;<span class="k" id="t-freq"></span></span></div>
    <div class="mini-bar"><i id="t-cpu-b"></i></div>
    <div class="tele-row"><span class="k">MEM</span><span class="v"><span id="t-mem">—</span>% &nbsp;<span class="k" id="t-memx"></span></span></div>
    <div class="mini-bar"><i id="t-mem-b"></i></div>
    <div class="tele-row"><span class="k">DISK</span><span class="v"><span id="t-disk">—</span>% &nbsp;<span class="k" id="t-diskx"></span></span></div>
    <div class="mini-bar"><i id="t-disk-b"></i></div>
    <div class="tele-sec">NETWORK</div>
    <div class="tele-row"><span class="k">SSID</span><span class="v" id="t-ssid">—</span></div>
    <div class="tele-row"><span class="k">DOWN</span><span class="v ice" id="t-down">—</span></div>
    <div class="tele-row"><span class="k">UP</span><span class="v ice" id="t-up">—</span></div>
    <div class="tele-sec">UPTIME</div>
    <div class="tele-row"><span class="k">SINCE BOOT</span><span class="v" id="t-up2">—</span></div>

    <div class="tele-sec">COOLING</div>
    <!-- fan speedometer (concept ported from Carpadi SpeedGauge): 270° sweep,
         needle + ticks, live RPM in the open gap. Colour shifts ice→gold→red
         as the fan spins up so a glance tells you something's overworking it. -->
    <div class="gauge-wrap">
      <svg id="fan-gauge" viewBox="0 0 200 200" aria-label="fan speed"></svg>
    </div>
  </div>

  <!-- CHROME -->
  <div class="reg tl"><span class="p"></span></div>
  <div class="reg tr"><span class="p"></span></div>
  <div class="reg bl"><span class="p"></span></div>
  <div class="reg br"><span class="p"></span></div>
  <div class="baseline">
    <div class="line"></div>
    <div class="brand">MG&nbsp;HOLDINGS</div>
    <div class="sub">CLASS-R · SYSTEMS INTERFACE</div>
  </div>
  <div class="status">
    <div class="r">R.A.Y.O</div>
    <div class="o" id="data-src">ONLINE</div>
  </div>
</div>

<script src="core/theme.js"></script>
<script src="core/hud.js"></script>
<script src="core/control.js"></script>
</body>
</html>
